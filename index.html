<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contextual Web Game Engine</title>
            <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #111;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BhMQdM9B.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="volume-ui" style="position: absolute; top: 20px; right: 20px; z-index: 1000; color: white; font-family: sans-serif; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; border: 2px solid #555;">
      <label style="font-weight: bold; margin-right: 10px;">🔊 Volume: <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.4"></label>
      <button id="mute-btn" style="padding: 5px 10px; cursor: pointer; font-weight: bold;">Mute</button>
    </div>
    <script>
      setTimeout(() => {
        const slider = document.getElementById('vol-slider');
        const muteBtn = document.getElementById('mute-btn');
        let isMuted = false;
        let previousVol = 0.4;

        slider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            if(window.game) window.game.sound.volume = vol;
            if(vol > 0) { isMuted = false; muteBtn.innerText = 'Mute'; }
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                previousVol = slider.value;
                slider.value = 0;
                if(window.game) window.game.sound.volume = 0;
                muteBtn.innerText = 'Unmute';
            } else {
                slider.value = previousVol > 0 ? previousVol : 0.4;
                if(window.game) window.game.sound.volume = slider.value;
                muteBtn.innerText = 'Mute';
            }
        });
      }, 1000);
    </script>
  </body>
</html>
